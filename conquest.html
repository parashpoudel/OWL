<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Conquest — OWL</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .conquest-wrap{max-width:1100px;margin:120px auto;padding:24px}
    .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
    .gallery img{width:100%;height:200px;object-fit:cover;border-radius:6px}
  </style>
</head>
<body>
  <nav id="mainNav">
    <a href="/" class="nav-logo">OWL</a>
    <ul class="nav-links">
      <li><a href="/blogs">Blogs</a></li>
      <li><a href="/past-conquests">Past Conquests</a></li>
      <li><a href="/admin">Admin</a></li>
    </ul>
  </nav>

  <div class="conquest-wrap">
    <h1 id="title">Conquest</h1>
    <p id="meta" class="conquest-meta" style="color:var(--fog)"></p>
    <div id="gallery" class="gallery"></div>
  </div>

  <script>
    const id = location.pathname.split('/').pop();
    async function load(){
      const res = await fetch(`/api/conquests/${id}`);
      const data = await res.json();
      if (!data.success) return document.getElementById('gallery').innerHTML = '<p style="color:var(--fog)">Not found</p>';
      const c = data.conquest;
      document.getElementById('title').textContent = c.title;
      document.getElementById('meta').textContent = new Date(c.createdAt).toLocaleDateString();
      const g = document.getElementById('gallery');
      g.innerHTML = c.images.map(img => `<img src="${img.url}" alt="${c.title}"/>`).join('');
    }
    load().catch(err=>{console.error(err);document.getElementById('gallery').innerHTML='<p style="color:var(--fog)">Failed to load.</p>'});
  </script>
</body>
</html>
