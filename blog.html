<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Detail - OWL Community</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
      background: linear-gradient(180deg, #080704 0%, #0f0d09 100%);
      color: #f7efd1;
    }
    #mainNav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 20px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(8, 7, 5, 0.94);
      border-bottom: 1px solid rgba(215, 178, 97, 0.18);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(14px);
    }
    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 4px;
      color: #f7efd1;
      text-decoration: none;
    }
    .nav-links {
      display: flex;
      gap: 30px;
      list-style: none;
    }
    .nav-links a {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #f7efd1;
      text-decoration: none;
      transition: color 0.3s;
    }
    .nav-links a:hover {
      color: #f2c96d;
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .nav-cta-login,
    .nav-cta {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      border: 1px solid #c4621a;
      color: #c4621a;
      padding: 10px 24px;
      text-decoration: none;
      transition: all 0.3s;
      background: transparent;
      cursor: pointer;
    }
    .nav-cta-login:hover,
    .nav-cta:hover {
      background: #c4621a;
      color: #1a1612;
    }
    .detail-meta .nav-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 22px;
      border: 1px solid rgba(215, 178, 97, 0.45);
      color: #fff7db;
      background: linear-gradient(135deg, rgba(196, 98, 26, 0.26), rgba(212, 166, 79, 0.16));
      border-radius: 999px;
      text-decoration: none;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 12px 28px rgba(0,0,0,0.2);
      transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease, color 0.25s ease;
    }
    .detail-meta .nav-cta::before {
      content: '↺';
      font-size: 14px;
      line-height: 1;
    }
    .detail-meta .nav-cta:hover {
      transform: translateY(-2px);
      color: #fff;
      background: linear-gradient(135deg, rgba(196, 98, 26, 0.38), rgba(212, 166, 79, 0.24));
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 16px 32px rgba(0,0,0,0.26);
    }
    .detail-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 120px 40px 60px;
    }
    .detail-meta {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 32px;
    }
    .audio-reader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
      padding: 18px 20px;
      border-radius: 16px;
      border: 1px solid rgba(215, 178, 97, 0.18);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .reader-copy {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .reader-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #ffd88a;
    }
    .reader-sub {
      font-size: 13px;
      color: #f2dfb0;
      font-family: 'Barlow', sans-serif;
      line-height: 1.5;
    }
    .reader-note {
      margin-top: 6px;
      font-size: 11px;
      color: #d8c08a;
      font-family: 'Barlow', sans-serif;
      letter-spacing: 0.3px;
      opacity: 0.9;
    }
    .reader-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .reader-controls button {
      border: none;
      border-radius: 999px;
      padding: 10px 14px;
      background: linear-gradient(135deg, rgba(196, 98, 26, 0.28), rgba(212, 166, 79, 0.2));
      color: #fff7db;
      cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .reader-controls button:hover {
      transform: translateY(-1px);
      background: linear-gradient(135deg, rgba(196, 98, 26, 0.38), rgba(212, 166, 79, 0.26));
    }
    .reader-status {
      font-size: 12px;
      color: #f2dfb0;
      font-family: 'Barlow', sans-serif;
      min-width: 90px;
      text-align: right;
    }
    .detail-card {
      background: rgba(16, 13, 10, 0.96);
      border: 1px solid rgba(215, 178, 97, 0.22);
      color: #f7efd1;
      box-shadow: 0 16px 46px rgba(0, 0, 0, 0.24);
    }
    .detail-card p {
      color: #f7efd1;
    }
    .article-block {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: flex-start;
      margin-bottom: 24px;
    }
    .article-block img {
      width: 100%;
      border-radius: 14px;
      object-fit: cover;
      border: 1px solid rgba(215, 178, 97, 0.18);
      box-shadow: 0 20px 50px rgba(0,0,0,0.16);
    }
    .article-block.left {
      grid-template-columns: minmax(260px, 1fr) 1.3fr;
    }
    .article-block.right {
      grid-template-columns: 1.3fr minmax(260px, 1fr);
    }
    .article-text {
      color: #f7efd2;
      font-size: 16px;
      line-height: 1.9;
      margin: 0;
    }
    .article-text p {
      margin: 0;
    }
    @media (max-width: 900px) {
      .article-block.left,
      .article-block.right {
        grid-template-columns: 1fr;
      }
    }
    .detail-meta h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(40px, 5vw, 58px);
      letter-spacing: 4px;
      margin: 0;
      color: #fff7e3;
      text-transform: uppercase;
      text-shadow: 0 2px 18px rgba(0,0,0,0.22);
    }
    .detail-meta .info {
      color: #f2dfb0;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: 'Barlow Condensed', sans-serif;
    }
    .detail-card {
      background: var(--stone);
      border: 1px solid rgba(196, 98, 26, 0.2);
      padding: 32px;
      margin-bottom: 32px;
    }
    .detail-card p {
      font-size: 16px;
      line-height: 1.8;
      color: #f7f0d5;
      margin-bottom: 20px;
      font-family: 'Barlow', sans-serif;
      letter-spacing: 0.2px;
    }
    .detail-images {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin-top: 24px;
    }
    .detail-images button {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      text-align: left;
    }
    .detail-images img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.08);
      display: block;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(3, 2, 1, 0.95);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 300;
    }
    .lightbox.open {
      display: flex;
    }
    .lightbox-stage {
      position: relative;
      width: min(980px, 100%);
      max-height: 90vh;
    }
    .lightbox-stage img {
      width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 25px 80px rgba(0,0,0,0.35);
    }
    .lightbox-close,
    .lightbox-nav {
      position: absolute;
      border: none;
      background: rgba(13, 11, 9, 0.82);
      color: var(--snow);
      cursor: pointer;
      border-radius: 999px;
      width: 44px;
      height: 44px;
      font-size: 24px;
    }
    .lightbox-close {
      top: 16px;
      right: 16px;
    }
    .lightbox-nav {
      top: 50%;
      transform: translateY(-50%);
    }
    .lightbox-nav-prev { left: 16px; }
    .lightbox-nav-next { right: 16px; }
    .detail-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 24px;
    }
    .detail-tag {
      background: rgba(255, 215, 125, 0.2);
      color: #fff6db;
      padding: 6px 12px;
      font-size: 11px;
      border-radius: 999px;
    }
    .offline-note {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(196,98,26,0.15);
      padding: 22px;
      margin-top: 20px;
      color: #f2dfb0;
      font-size: 14px;
      font-family: 'Barlow', sans-serif;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <nav id="mainNav">
    <a href="/" class="nav-logo">OWL</a>
    <div class="nav-actions">
      <a href="/login" class="nav-cta-login">Login</a>
      <a href="/" class="nav-cta">Join Inner Circle</a>
    </div>
  </nav>

  <div class="detail-wrap">
    <div class="detail-meta">
      <div>
        <h1 id="blogTitle">Loading...</h1>
        <div class="info" id="blogMeta">Please wait while the story loads.</div>
      </div>
      <a href="/blogs" class="nav-cta" style="height: fit-content;">Back to Blogs</a>
    </div>

    <div class="audio-reader" id="audioReader">
      <div class="reader-copy">
        <div class="reader-title">Audio companion</div>        <div class="reader-sub">Listen to the story with the most natural voice available on your device.</div>
      </div>
      <div class="reader-controls">
        <button id="playAudioBtn" type="button">▶ Play</button>
        <button id="pauseAudioBtn" type="button">❚❚ Pause</button>
        <button id="stopAudioBtn" type="button">■ Stop</button>
        <div class="reader-status" id="readerStatus">Ready</div>
      </div>
    </div>

    <div class="detail-card" id="blogContent">
      <p>Fetching blog details from the community archive.</p>
    </div>

    <div class="detail-images" id="imageGallery"></div>
    <div class="detail-tags" id="tagList"></div>
    <div class="offline-note" id="errorNote" style="display:none;"></div>
  </div>

  <div class="lightbox" id="imageLightbox" aria-hidden="true">
    <div class="lightbox-stage">
      <button class="lightbox-close" id="lightboxClose" aria-label="Close slideshow">×</button>
      <button class="lightbox-nav lightbox-nav-prev" id="lightboxPrev" aria-label="Previous image">‹</button>
      <img id="lightboxImage" src="" alt="Blog gallery image" />
      <button class="lightbox-nav lightbox-nav-next" id="lightboxNext" aria-label="Next image">›</button>
    </div>
  </div>

  <script>
    const API_URL = `${window.location.protocol}//${window.location.host}/api`;
    const blogId = window.location.pathname.split('/').pop();
    let lightboxImages = [];
    let currentImageIndex = 0;
    let currentBlog = null;
    let currentVoice = null;

    function updateReaderStatus(message) {
      const status = document.getElementById('readerStatus');
      if (status) status.textContent = message;
    }

    function setVoice() {
      if (!('speechSynthesis' in window)) return;
      const voices = window.speechSynthesis.getVoices();
      const preferredVoice = voices.find((voice) => /moira|samantha|siri|victoria|jenny|aria|ava|kate|ann|tessa|serena|david|daniel|emma|oliver|james|rishi|lisa|rachel|priya|meera|neerja/i.test(voice.name))
        || voices.find((voice) => /en-gb|en-in|en-us/i.test(voice.lang))
        || voices.find((voice) => /en/i.test(voice.lang))
        || voices[0];
      currentVoice = preferredVoice || null;

      if (!currentVoice) {
        window.speechSynthesis.onvoiceschanged = () => {
          const fallbackVoices = window.speechSynthesis.getVoices();
          const fallbackVoice = fallbackVoices.find((voice) => /moira|samantha|siri|victoria|jenny|aria|ava|kate|ann|tessa|serena|david|daniel|emma|oliver|james|rishi|lisa|rachel|priya|meera|neerja/i.test(voice.name))
            || fallbackVoices.find((voice) => /en-gb|en-in|en-us/i.test(voice.lang))
            || fallbackVoices.find((voice) => /en/i.test(voice.lang))
            || fallbackVoices[0];
          currentVoice = fallbackVoice || null;
        };
      }
    }

    function stopAudio() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      updateReaderStatus('Stopped');
    }

    function pauseAudio() {
      if ('speechSynthesis' in window && window.speechSynthesis.speaking) {
        if (window.speechSynthesis.paused) {
          window.speechSynthesis.resume();
          updateReaderStatus('Playing');
        } else {
          window.speechSynthesis.pause();
          updateReaderStatus('Paused');
        }
      }
    }

    function playBlogAudio(blog) {
      if (!('speechSynthesis' in window)) {
        updateReaderStatus('Not supported');
        return;
      }

      const text = `${blog.title}. ${blog.content.replace(/\n+/g, '. ')}`;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.92;
      utterance.pitch = 1.0;
      utterance.volume = 0.95;
      utterance.voice = currentVoice;
      utterance.onstart = () => updateReaderStatus('Playing');
      utterance.onend = () => updateReaderStatus('Finished');
      utterance.onerror = () => updateReaderStatus('Unable to play');
      window.speechSynthesis.speak(utterance);
    }

    function openLightbox(index) {
      if (!lightboxImages.length) return;
      currentImageIndex = index;
      const lightbox = document.getElementById('imageLightbox');
      const image = document.getElementById('lightboxImage');
      const item = lightboxImages[index];
      image.src = item.url;
      image.alt = item.caption || 'Blog image';
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      const lightbox = document.getElementById('imageLightbox');
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    function showNextImage(direction) {
      if (!lightboxImages.length) return;
      currentImageIndex = (currentImageIndex + direction + lightboxImages.length) % lightboxImages.length;
      const item = lightboxImages[currentImageIndex];
      const image = document.getElementById('lightboxImage');
      image.src = item.url;
      image.alt = item.caption || 'Blog image';
    }

    document.getElementById('playAudioBtn').addEventListener('click', () => {
      if (currentBlog) playBlogAudio(currentBlog);
    });
    document.getElementById('pauseAudioBtn').addEventListener('click', pauseAudio);
    document.getElementById('stopAudioBtn').addEventListener('click', stopAudio);
    document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
    document.getElementById('lightboxPrev').addEventListener('click', () => showNextImage(-1));
    document.getElementById('lightboxNext').addEventListener('click', () => showNextImage(1));
    document.getElementById('imageLightbox').addEventListener('click', (event) => {
      if (event.target.id === 'imageLightbox') closeLightbox();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') closeLightbox();
      if (document.getElementById('imageLightbox').classList.contains('open')) {
        if (event.key === 'ArrowRight') showNextImage(1);
        if (event.key === 'ArrowLeft') showNextImage(-1);
      }
    });

    async function loadBlog() {
      try {
        const response = await fetch(`${API_URL}/blogs/${blogId}`);
        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || 'Blog not found');
        }

        const blog = result.blog;
        currentBlog = blog;
        document.getElementById('blogTitle').textContent = blog.title;
        document.getElementById('blogMeta').textContent = `${blog.authorName} · ${new Date(blog.createdAt).toLocaleDateString()}`;

        const contentEl = document.getElementById('blogContent');
        const paragraphs = blog.content.split('\n').filter(Boolean);
        contentEl.innerHTML = paragraphs.map(paragraph => `<p>${paragraph}</p>`).join('');

        lightboxImages = blog.images || [];
        const gallery = document.getElementById('imageGallery');
        gallery.innerHTML = lightboxImages.length
          ? lightboxImages.map((img, index) => `
              <button type="button" class="gallery-thumb" data-index="${index}">
                <img src="${img.url}" alt="${img.caption || 'Blog image'}" />
              </button>
            `).join('')
          : '';

        gallery.querySelectorAll('.gallery-thumb').forEach((button) => {
          button.addEventListener('click', () => openLightbox(Number(button.dataset.index)));
        });

        const tagList = document.getElementById('tagList');
        tagList.innerHTML = blog.tags.map(tag => `<span class="detail-tag">${tag}</span>`).join('');
      } catch (error) {
        const note = document.getElementById('errorNote');
        note.textContent = error.message;
        note.style.display = 'block';
        document.getElementById('blogTitle').textContent = 'Unable to load blog';
        document.getElementById('blogContent').innerHTML = '<p>Please return to the blogs page and try again.</p>';
      }
    }

    setVoice();
    loadBlog();
  </script>
</body>
</html>
