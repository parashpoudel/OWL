<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Past Conquests — OWL</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .conquests-container{max-width:1100px;margin:120px auto;padding:24px}
    .conquests-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:18px}
    .conquest-card{height:220px;border-radius:10px;color:var(--snow);display:flex;align-items:flex-end;padding:16px;background-size:cover;background-position:center;box-shadow:0 8px 24px rgba(0,0,0,0.35);text-decoration:none}
    .conquest-card .overlay{background:linear-gradient(0deg,rgba(0,0,0,0.5),transparent);position:absolute;inset:0;border-radius:10px}
    .conquest-meta{color:var(--fog);font-size:13px}
    .conquest-card a{color:inherit;text-decoration:none}
    .conquest-title{position:relative;z-index:2;font-weight:700;letter-spacing:1px}
  </style>
</head>
<body>
  <nav id="mainNav">
    <a href="/" class="nav-logo">OWL</a>
    <ul class="nav-links">
      <li><a href="/blogs">Blogs</a></li>
      <li><a href="/past-conquests">Past Conquests</a></li>
      <li><a href="/admin">Admin</a></li>
    </ul>
    <div class="nav-actions">
      <a href="/login" class="nav-cta-login">Login</a>
    </div>
  </nav>

  <div class="conquests-container">
    <h1>Past Conquests</h1>
    <p class="conquest-meta">Click a conquest title to view all photos.</p>
    <div id="list" class="conquests-grid"></div>
  </div>

  <script>
    async function load() {
      const res = await fetch('/api/conquests');
      const data = await res.json();
      const list = document.getElementById('list');
      if (!data.success || !data.conquests.length) {
        list.innerHTML = '<p style="color:var(--fog)">No conquests uploaded yet.</p>';
        return;
      }
      list.innerHTML = data.conquests.map(c => {
        const cover = c.cover || '/assets/river.jpg';
        return `
          <a class="conquest-card" href="/conquest/${c._id}" style="background-image:url('${cover}')">
            <div class="conquest-title">${c.title}</div>
            <div class="conquest-meta" style="position:relative;z-index:2;margin-left:auto">${new Date(c.createdAt).toLocaleDateString()} · ${c.count}</div>
          </a>
        `
      }).join('');
    }
    load().catch(err=>{console.error(err);document.getElementById('list').innerHTML='<p style="color:var(--fog)">Failed to load.</p>'});
  </script>
</body>
</html>
